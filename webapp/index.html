<!DOCTYPE html>
<!--
  index.html — Vite HTML Entry Point

  Vite uses this as the application shell. The <div id="root"> is where
  React mounts. Vite automatically injects the correct script/module tags
  during both dev and build.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism — Read the Whole Story</title>
  <meta name="description" content="Prism analyzes any article or post — surfacing a verifiability score, credible counter-evidence, and the strongest opposing argument. Without leaving the page." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- React mounts here -->
  <div id="root"></div>

  <!-- Vite injects this during build -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
