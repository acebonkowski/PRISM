<!DOCTYPE html>
<!--
  popup.html — Prism Extension Popup
  Flow: Start Screen → Loading Screen → Results (with on-demand Challenge)
  Icons: Feather (inline SVGs — no CDN dependency in extension context)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="popup-wrap">

  <!-- ═══════════════════════════════════════════════════════
       START SCREEN
       Shows on open. User must click Analyze to begin.
  ═══════════════════════════════════════════════════════ -->
  <div id="start-screen" class="screen">
    <div class="hero-visual">
      <img src="icons/starter-visual%20(1).svg" class="hero-illustration" alt="" aria-hidden="true" />
    </div>
    <div class="start-body">
      <h1 class="start-title">Is It The Full Story?</h1>
      <p class="start-desc">PRISM analyzes what's on your screen, scans the web and identifies what's missing.</p>
    </div>
    <div class="start-footer">
      <button id="analyze-btn" class="btn-primary btn-full">
        <img src="icons/prism-white.svg" class="btn-logo" alt="" aria-hidden="true" />
        Analyze
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       LOADING SCREEN
       Spinning triangle + cancel (X) that returns to start.
  ═══════════════════════════════════════════════════════ -->
  <div id="loading-screen" class="screen hidden">
    <div class="loading-topbar">
      <button id="cancel-btn" class="icon-btn" aria-label="Cancel and go back">
        <!-- Feather: x -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="loading-body">
      <!-- Spinning Prism logo -->
      <img src="icons/prism-color.svg" class="logo-spin" alt="" aria-hidden="true" />
      <p class="loading-title" id="loading-title">Scanning...</p>
      <p class="loading-sub">This can take a moment. <br> Please don't close this tab.</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       ERROR STATE
  ═══════════════════════════════════════════════════════ -->
  <div id="error-state" class="screen hidden">
    <div class="error-body">
      <!-- Feather: alert-circle -->
      <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p id="error-message" class="error-message">Something went wrong. Try again.</p>
      <button id="error-back-btn" class="btn-outline">Go Back</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       RESULTS SCREEN
       Shown after analysis. Challenge section is hidden until
       the user clicks "Challenge Argument".
  ═══════════════════════════════════════════════════════ -->
  <div id="results" class="screen hidden">

    <!-- Row 1: prism logo (left) · share icon (right) -->
    <div class="results-topbar">
      <img src="icons/prism-color.svg" class="results-prism-logo" alt="" aria-hidden="true" />
      <button id="share-btn" class="icon-btn share-icon-btn" aria-label="Export PDF">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>

    <!-- Row 2: score number — left aligned -->
    <div class="score-headline">
      <span id="score-number" class="score-num">--</span>
      <span class="score-denom">/100</span>
    </div>

    <!-- Row 3: category label — left aligned -->
    <span id="score-label" class="score-lbl">Verifiable</span>

    <!-- Bar with consistent card padding on sides, thick -->
    <div class="score-bar-wrap">
      <div class="score-track">
        <div id="score-fill" class="score-fill"></div>
      </div>
    </div>

    <!-- Description / summary (max ~37 words, enforced by popup.js) -->
    <p id="summary-text" class="summary-text"></p>

    <!-- ── VERIFIED BY (collapsible) ── -->
    <div class="collapsible" id="verified-section">
      <button class="collapse-hdr" id="verified-toggle" aria-expanded="true">
        <span class="collapse-title">
          <!-- Feather: check -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#0F0B3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          VERIFIED BY
        </span>
        <!-- Feather: chevron-up -->
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="#0F0B3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <div class="collapse-body" id="verified-body">
        <ul id="sources-list" class="sources-list"></ul>
      </div>
    </div>

    <!-- ── COUNTERARGUMENT section (hidden until Challenge clicked) ── -->
    <div class="collapsible hidden" id="counterarg-section">
      <button class="collapse-hdr" id="counterarg-toggle" aria-expanded="true">
        <span class="collapse-title">
          <!-- Layers icon -->
          <svg width="18" height="18" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 8.5L6 11L11 8.5M1 6L6 8.5L11 6M6 1L1 3.5L6 6L11 3.5L6 1Z" stroke="#0F0B3E" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          COUNTERARGUMENT
        </span>
        <!-- Feather: chevron-up -->
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="#0F0B3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <div class="collapse-body" id="counterarg-body">
        <!-- Mini loading while fetching challenge -->
        <div id="counterarg-loading" class="mini-loading hidden">
          <img src="icons/prism-color.svg" class="logo-spin-sm" alt="" aria-hidden="true" />
          <span id="counterarg-loading-title">Scanning...</span>
        </div>
        <!-- Populated by popup.js after challenge completes -->
        <div id="counter-args-list" class="counter-content hidden"></div>
      </div>
    </div>

    <!-- Challenge button — triggers second API call -->
    <div class="challenge-wrap">
      <button id="challenge-btn" class="btn-outline btn-full">Challenge Argument</button>
    </div>

  </div><!-- /results -->

</div><!-- /popup-wrap -->

<script src="popup.js"></script>
</body>
</html>
